</style><script>window.GRANADA_TITLES=["GRANADA, 1927", "EL RINCONCILLO", "DON MANUEL", "FEDERICO", "HERMENEGILDO", "MANUEL ÁNGELES", "LOS TÍTERES", "LA PUERTA DEL VINO", "ANTES DE SABERLO", "AGOSTO", "EL BARRANCO", "LA CIUDAD CALLÓ", "LA CASA CERRADA", "LA VEGA", "GRAN VÍA", "ALHAMBRA S. A.", "HABITACIÓN CON TURISTAS", "CIEN AÑOS", "GRANADA, 2027", "EL NUEVO RINCONCILLO", "GALLO VUELVE A CANTAR", "LOS OTROS", "LAS QUE FALTABAN", "CANCIÓN PARA QUIEN ACABA DE LLEGAR", "LA CIUDAD QUE TODAVÍA PUEDE SER", "QUE VUELVA A OCURRIR", "UN SIGLO DESPUÉS"];window.GRANADA_H_TITLES=["LA PRIMERA MAÑANA", "ANTES DEL NOMBRE", "UNA VOZ NUEVA", "LA LUZ ANTIGUA", "LA MANO QUE MUEVE", "EL NOMBRE EN EL PORTAL", "LO QUE NO FIGURA", "NINGUNA VOZ SOLA", "LO QUE SE PRESIENTE", "LA SOMBRA EN LA PARED", "LA HUELLA", "DEBAJO", "EL UMBRAL", "BAJO LA CAL", "EL OTRO LADO", "LO QUE REGRESA", "LA MUESCA", "LA FORMA QUE CAMBIA", "LO QUE VENDRÁ", "EL AGUA ANTIGUA", "TODAVÍA", "LO QUE QUEDA", "HACER SITIO", "OTRA LUZ", "LA PUERTA ABIERTA", "VOLVER A EMPEZAR", "EL PORVENIR"];window.GRANADA_ROWS=[];</script><script src="matrix-1.js?v=16"></script><script src="matrix-2.js?v=16"></script><script src="matrix-3.js?v=16"></script></head><body><div id="app"><header><div class="brand"><strong>LA GRANADA DEL 27</strong><small>Un siglo después · edición completa · 58 piezas</small></div><nav><button class="mode active" data-mode="bookview">LIBRO</button><button class="mode" data-mode="verticalreader">VERTICAL</button><button class="mode" data-mode="horizontal">HORIZONTAL</button><button class="mode" data-mode="radial">RADIAL</button></nav><div><button class="btn" id="full">⛶</button></div></header><main><section id="bookview" class="view"><div class="stage"><article class="page" id="page"></article></div><div class="nav"><button class="btn" id="bp">← Anterior</button><div class="progress" id="prog"></div><button class="btn" id="bn">Siguiente →</button></div></section><section id="verticalreader" class="view reader hidden"><button class="move prev" id="vp">‹</button><button class="move next" id="vn">›</button><article class="sheet"><div class="eyebrow" id="vi"></div><h2 id="vt"></h2><div id="vl"></div></article></section><section id="horizontal" class="view hidden"><div class="hnav"><button id="hrp">↑</button><span id="hr"></span><button id="hrn">↓</button></div><div class="hwrap"><button class="btn" id="hvp">‹</button><div class="hcenter"><div class="htitle" id="ht"></div><div class="hcurrent" id="hc"></div><div class="hpos" id="hp"></div></div><button class="btn" id="hvn">›</button></div></section><section id="radial" class="view hidden"><div class="rad"><div class="branch" id="rl"><div class="btitle">I · HACIA LO ENTERRADO</div></div><div class="branch" id="rr"><div class="btitle">II · HACIA LO ABIERTO</div></div></div></section></main></div><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],PRO="Granada no empezó en 1927.\nYa estaba el agua\nabriendo lentamente la tierra,\nla nieve guardada en la Sierra,\nla cal, el barro,\nlos patios que aprendieron a dar sombra,\nla Vega entrando en la ciudad\nmucho antes de que la ciudad\nsupiera dónde terminaba.\nPero hubo un tiempo\nen que algunas voces se encontraron\nalrededor de una mesa.\nNo sabían todavía\nque cien años después\nalguien volvería a mirarlas.\nHablaron.\nDiscutieron.\nAlguien golpeó un vaso con la uña.\nOtro escuchó una música escondida.\nUno dibujó la forma de la luz.\nOtro puso un muñeco sobre un hilo.\nAlguien escribió la luna,\nla sangre,\nel caballo,\nla raíz.\nGranada estaba allí\ny también fuera de allí.\nEstaba en quienes no salieron en la fotografía,\nen quien sirvió la copa,\nen quien barrió después,\nen las mujeres que trabajaban\nmientras otros nombres llegaban a los libros,\nen la gente que nunca dijo\nque estaba haciendo cultura\ny, sin embargo,\nla estaba haciendo.\nLuego vino agosto.\nHubo puertas que dejaron de abrirse,\ncasas donde un nombre bajó la voz,\ncunetas,\nsilencios heredados,\nfotografías guardadas demasiado tiempo.\nLa ciudad siguió creciendo.\nLlegaron el asfalto,\nlos bloques,\nlas pantallas,\nlas maletas,\nlos códigos,\nlos turnos de entrada,\nlas habitaciones donde nadie permanece,\nlas lenguas nuevas\nque empezaron a doblar las esquinas.\nY debajo continuó el agua.\nEste libro no quiere volver a 1927.\nVolver sería imposible.\nTampoco quiere levantar una estatua\na lo que estuvo vivo.\nQuiere acercar otra mesa.\nPreguntar qué quedó dentro de la imagen\ny qué permaneció fuera.\nMirar la ciudad desde sus márgenes,\ndesde sus heridas,\ndesde quienes llegan,\ndesde quienes faltaron en el relato,\ndesde aquello que todavía\nno sabemos nombrar.\nHan pasado cien años.\nEs tiempo suficiente\npara descubrir que un siglo\nno es una distancia.\nEs una pregunta.\nY Granada\ntodavía no ha terminado\nde responderla.",EPI="Después del último verso,\nGranada sigue callada.\nEl Genil sigue su curso,\nla Sierra guarda su alba.\nSe levanta una persiana,\npasa una maleta blanca.\nLa mujer escribe nombres\ndonde faltaban palabras.\nEn una cocina hierve\nla receta de otra casa.\nEn una mesa discuten\ndos voces que no se callan.\nLa Alhambra recibe ojos\nsobre la piedra dorada.\nLa Vega pierde otro palmo;\nbajo el cemento va el agua.\nBuscando raíces viejas\nque no olvidan su llamada.\nHabrá quien nombre a los muertos\nsin volver su nombre placa.\nHabrá quien llegue de lejos\ncon otra luz en la cara.\nLa ciudad no es una herencia\nni una puerta ya cerrada.\nTambién es de quien pregunta,\nde quien discute en la plaza,\nde quien ensancha la mesa\npara que quepan más almas.\nDe quien contempla los márgenes\ny ve que el mundo no acaba.\nCien años parecen muchos\nsi los cuenta la mirada.\nLa tierra mide distinto,\nsu tiempo no tiene marcas.\nPasarán nombres y mapas,\ncambiarán voces y casas.\nSierra seguirá allí,\nsobre techos de Granada.\nDentro quizá de otro siglo\nalguien leerá palabras.\nY tal vez sonría al verlas\ncomo quien vuelve a una casa.\nQue jamás halle respuesta\ny la pregunta no calla.\nMientras se oiga una pregunta\ny se ensanche alguna plaza,\nmientras una voz de fuera\ncambie el rumor de la casa,\nmientras el agua recuerde\npor dónde pasaba el agua,\nGranada no estará hecha\nni quedará terminada.\nSerá ciudad mientras cambie\nsin arrancar su entraña.\nY cuando el libro se cierre,\nseguirá viva Granada.\nPorque después de los versos\nqueda la luz en las casas,\nqueda la mesa con vida.\nGranada queda en el agua.";let items=[],bi=0,pi=0,row=13,hp=0;const pv=i=>GRANADA_ROWS.map(r=>r.verses[i]);
function build(){let n=0;const add=(k,e,t,l)=>{n++;items.push({k,e,t,l,n})};items.push({k:'s',t:'LA GRANADA DEL 27 · UN SIGLO DESPUÉS',sub:'Edición completa · 58 piezas poéticas'});add('t','PRÓLOGO','ANTES DE CONTAR',PRO.split('\n'));items.push({k:'s',t:'LIBRO I · LA GRANADA DEL 27',sub:'27 poemas verticales'});GRANADA_TITLES.forEach((t,i)=>add('p',`${String(i+1).padStart(2,'0')} · VERTICAL`,t,pv(i)));items.push({k:'s',t:'LIBRO II · BAJO LA CAL',sub:'27 poemas horizontales'});GRANADA_ROWS.forEach((r,i)=>add('p',`H${String(i+1).padStart(2,'0')} · HORIZONTAL`,GRANADA_H_TITLES[i],r.verses));items.push({k:'s',t:'LIBRO III · LA GRANADA DEL 27',sub:'El centro secreto'});const v=GRANADA_ROWS[13].verses;add('p','I · RADIAL','HACIA LO ENTERRADO',[v[13],...v.slice(0,13).reverse()]);add('p','II · RADIAL','HACIA LO ABIERTO',[v[13],...v.slice(14)]);items.push({k:'r',t:'LA GRANADA DEL DOS SIETE',sub:'LA GRANADA DEL 27',body:'Dos lecturas que nacen del mismo verso central'});add('t','EPÍLOGO','GRANADA QUEDA',EPI.split('\n'));items.push({k:'s',t:'OTRA MANERA DE LEER',sub:'56 poemas matriciales · 58 piezas poéticas',body:'27 verticales + 27 horizontales + 2 radiales. Prólogo y epílogo quedan fuera de la matriz.'})}
function book(){let x=items[bi],el=$('#page');el.innerHTML='';el.scrollTop=0;if(x.k==='s'||x.k==='r'){el.innerHTML=`<div class="section"><div><h2 class="${x.k==='r'?'reveal':''}">${x.t}</h2><p>${x.sub||''}</p><p>${x.body||''}</p></div></div>`}else{el.innerHTML=`<div class="eyebrow">${x.e}</div><h2>${x.t}</h2><div class="${x.k==='t'?'text':'lines'}"></div>`;let b=el.lastElementChild;if(x.k==='t')b.textContent=x.l.join('\n');else x.l.forEach(z=>{let d=document.createElement('div');d.className='line';d.textContent=z;b.appendChild(d)})}$('#prog').textContent=`${bi+1} / ${items.length}${x.n?` · pieza ${x.n}/58`:''}`;$('#bp').disabled=bi===0;$('#bn').disabled=bi===items.length-1}
function vert(){pi=(pi+27)%27;$('#vi').textContent=`${String(pi+1).padStart(2,'0')} / 27`;$('#vt').textContent=GRANADA_TITLES[pi];$('#vl').innerHTML='';pv(pi).forEach(z=>{let d=document.createElement('div');d.className='vline';d.textContent=z;$('#vl').appendChild(d)})}
function horiz(){let r=GRANADA_ROWS[row];hp=(hp+27)%27;$('#hr').textContent=`H${String(r.row).padStart(2,'0')} / 27`;$('#ht').textContent=GRANADA_H_TITLES[row];$('#hc').textContent=r.verses[hp];$('#hp').textContent=`${String(hp+1).padStart(2,'0')} / 27 · ${GRANADA_TITLES[hp]}`}
function rr(el,a){[...el.querySelectorAll('.rrow')].forEach(n=>n.remove());let m=['L','A','G','R','A','N','A','D','A','D','E','L','DOS','SIETE'];a.forEach((z,i)=>{let d=document.createElement('div');d.className='rrow';d.innerHTML=`<div class="rmark">${m[i]}</div><div class="rtext"></div>`;d.lastChild.textContent=z;el.appendChild(d)})}function radial(){let v=GRANADA_ROWS[13].verses;rr($('#rl'),[v[13],...v.slice(0,13).reverse()]);rr($('#rr'),[v[13],...v.slice(14)])}
function mode(id){$$('.view').forEach(v=>v.classList.add('hidden'));$('#'+id).classList.remove('hidden');$$('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===id));if(id==='bookview')book();if(id==='verticalreader')vert();if(id==='horizontal')horiz();if(id==='radial')radial();history.replaceState(null,'','#'+id)}$$('.mode').forEach(b=>b.onclick=()=>mode(b.dataset.mode));$('#bp').onclick=()=>{bi=Math.max(0,bi-1);book()};$('#bn').onclick=()=>{bi=Math.min(items.length-1,bi+1);book()};$('#vp').onclick=()=>{pi--;vert()};$('#vn').onclick=()=>{pi++;vert()};$('#hrp').onclick=()=>{row=(row+26)%27;hp=0;horiz()};$('#hrn').onclick=()=>{row=(row+1)%27;hp=0;horiz()};$('#hvp').onclick=()=>{hp--;horiz()};$('#hvn').onclick=()=>{hp++;horiz()};$('#full').onclick=()=>!document.fullscreenElement?document.documentElement.requestFullscreen?.():document.exitFullscreen?.();build();book();vert();horiz();radial();let h=location.hash.slice(1);if(['bookview','verticalreader','horizontal','radial'].includes(h))mode(h);
</script></body></html>
