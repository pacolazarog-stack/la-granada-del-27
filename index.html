<style>
:root{--bg:#100f0d;--bar:#15120f;--paper:#f4eee4;--ink:#211d19;--red:#7c211d;--muted:#aa9d90}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Georgia,"Times New Roman",serif;color:#f4ede5}button{font:inherit;cursor:pointer}.hidden{display:none!important}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;padding:10px 16px;background:var(--bar);border-bottom:1px solid rgba(255,255,255,.15);z-index:20}.brand strong{display:block;font-size:14px;letter-spacing:.08em;font-weight:400}.brand small{font-size:11px;color:#b8aa9c}.modes{display:flex;gap:8px}.mode,.tool,.navbtn,.hbtn{border:1px solid rgba(255,255,255,.28);background:#211d19;color:#f4ede5}.mode{border-radius:999px;padding:8px 15px;font-size:12px;letter-spacing:.08em}.mode.active{background:#efe6db;color:#211d19}.tools{justify-self:end}.tool{width:36px;height:36px;border-radius:50%}main,.view{height:100%;min-height:0;overflow:hidden}
#bookview{display:grid;grid-template-rows:minmax(0,1fr) auto}.stage{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px 24px}.book{height:100%;width:min(94vw,1360px);display:flex;align-items:center;justify-content:center}.single,.spread{display:none;height:min(96%,820px)}.single.on,.spread.on{display:flex}.paper{height:100%;aspect-ratio:148/210;background:#fff;overflow:hidden;box-shadow:0 18px 42px rgba(0,0,0,.42)}.paper img{width:100%;height:100%;object-fit:contain;display:block}.spread .paper{box-shadow:none}.spread{filter:drop-shadow(0 18px 30px rgba(0,0,0,.36))}.booknav{display:flex;justify-content:center;align-items:center;gap:12px;padding:10px 14px 14px}.navbtn{border-radius:999px;padding:8px 14px}.progress{min-width:160px;text-align:center;font-size:12px;color:#cbbeb1}
#verticalreader{position:relative;overflow:auto;padding:26px 66px 34px}.vsheet{width:min(760px,100%);margin:0 auto;background:var(--paper);color:var(--ink);padding:32px 48px 40px;box-shadow:0 18px 42px rgba(0,0,0,.30)}.vhead{text-align:center;margin-bottom:22px}.vindex,.vcount{font-size:11px;letter-spacing:.16em;color:#8b7d70}.vtitle{margin:6px 0 0;font-size:30px;font-weight:400}.vpoem{display:grid;gap:4px}.vline{font-size:17px;line-height:1.32;min-height:1.32em;white-space:nowrap}.vcount{text-align:center;margin-top:20px}.vmove{position:fixed;top:50%;transform:translateY(-50%);z-index:5;border:0;background:transparent;color:#eee2d6;font-size:36px}.vmove.prev{left:24px}.vmove.next{right:24px}
#horizontal{position:relative}.rownav{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;background:rgba(21,18,15,.94);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:5px 7px}.rownav button{border:0;background:transparent;color:#fff;width:34px;height:34px;font-size:18px}.rowlabel{min-width:96px;text-align:center;font-size:12px;letter-spacing:.14em;color:#d8ccc0}.hcarousel{height:100%;display:grid;grid-template-columns:54px minmax(0,1fr) minmax(500px,54vw) minmax(0,1fr) 54px;gap:24px;align-items:center;padding:74px 24px 34px}.hbtn{height:72px;border-radius:999px;font-size:34px}.hside{overflow:hidden;white-space:nowrap;color:#c4b7aa;opacity:.33;font-size:20px}.hside.left{text-align:right}.hcenter{text-align:center;padding:30px 20px;border-top:1px solid rgba(255,255,255,.10);border-bottom:1px solid rgba(255,255,255,.10)}.htitle{font-size:14px;letter-spacing:.16em;color:#cbbeb1;margin-bottom:18px}.hcurrent{white-space:nowrap;font-size:42px;line-height:1.15}.hpos{margin-top:18px;font-size:11px;letter-spacing:.16em;color:#8f8174}
#radial{overflow:auto;padding:26px 34px 34px}.radial-stage{position:relative;width:min(1260px,96%);min-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);box-shadow:0 24px 58px rgba(0,0,0,.42);padding-top:118px}.radial-stage::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,rgba(124,33,29,.64),rgba(124,33,29,.20) 18%,rgba(124,33,29,.10) 82%,rgba(124,33,29,.40));z-index:3}.radial-head{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;color:var(--red);pointer-events:none}.radial-head .num{width:38px;height:38px;border:1px solid rgba(124,33,29,.65);border-radius:50%;background:var(--paper);display:grid;place-items:center;font-weight:700;box-shadow:0 0 0 7px var(--paper)}.radial-head .title{margin-top:7px;background:var(--paper);padding:2px 8px;font-size:12px;letter-spacing:.16em;white-space:nowrap}.radial-head .result{margin-top:10px;font-size:13px;letter-spacing:.24em;white-space:nowrap;color:#5e1916}.rbranch{background:var(--paper);color:var(--ink);padding:30px 44px 54px;min-height:650px}.rbranch:first-child{border-right:1px solid rgba(80,62,48,.14)}.rbranch-title{text-align:center;color:var(--red);font-size:11px;letter-spacing:.14em;margin-bottom:18px}.rrow{display:grid;grid-template-columns:62px minmax(0,1fr);column-gap:14px;align-items:baseline;margin:0 0 .58em}.rmark{font-size:14px;line-height:1.52;color:var(--red);font-weight:700;letter-spacing:.06em;text-align:right;white-space:nowrap}.rtext{font-size:21px;line-height:1.52;text-align:left;opacity:.86}.rrow:first-of-type{padding-bottom:1em;margin-bottom:1em;border-bottom:1px solid rgba(80,62,48,.18)}.rrow:first-of-type .rmark,.rrow:first-of-type .rtext{font-weight:700;opacity:1}.rlegend{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:6;background:var(--paper);color:#7c211d;padding:3px 10px;font-size:10px;letter-spacing:.12em;white-space:nowrap}
@media(max-width:900px){header{grid-template-columns:1fr auto;grid-template-areas:"brand tools" "modes modes";gap:8px}.brand{grid-area:brand}.modes{grid-area:modes;justify-content:flex-start;overflow-x:auto}.tools{grid-area:tools}.mode{padding:7px 11px;font-size:10px}.hcarousel{grid-template-columns:44px minmax(0,1fr) 44px}.hside{display:none}.hcenter{grid-column:2}.hbtn.left{grid-column:1}.hbtn.right{grid-column:3}.radial-stage{min-width:780px}.rbranch{padding:28px 28px 46px}.rtext{font-size:18px}.rmark{font-size:12px}}
@media(max-width:580px){#verticalreader{padding:18px 44px}.vsheet{padding:26px 18px}.vline{font-size:13px;white-space:normal}.radial-stage{min-width:720px}.hcurrent{font-size:25px}.hcarousel{padding-inline:8px;gap:8px}.htitle{font-size:11px}}
</style>
<script>
window.GRANADA_TITLES=["GRANADA, 1927","EL RINCONCILLO","DON MANUEL","FEDERICO","HERMENEGILDO","MANUEL ÁNGELES","LOS TÍTERES","LA PUERTA DEL VINO","ANTES DE SABERLO","AGOSTO","EL BARRANCO","LA CIUDAD CALLÓ","LA CASA CERRADA","LA VEGA","GRAN VÍA","ALHAMBRA S. A.","HABITACIÓN CON TURISTAS","CIEN AÑOS","GRANADA, 2027","EL NUEVO RINCONCILLO","GALLO VUELVE A CANTAR","LOS OTROS","LAS QUE FALTABAN","CANCIÓN PARA QUIEN ACABA DE LLEGAR","LA CIUDAD QUE TODAVÍA PUEDE SER","QUE VUELVA A OCURRIR","UN SIGLO DESPUÉS"];
window.GRANADA_H_TITLES=["LA PRIMERA MAÑANA","ANTES DEL NOMBRE","UNA VOZ NUEVA","LA LUZ ANTIGUA","LA MANO QUE MUEVE","EL NOMBRE EN EL PORTAL","LO QUE NO FIGURA","NINGUNA VOZ SOLA","LO QUE SE PRESIENTE","LA SOMBRA EN LA PARED","LA HUELLA","DEBAJO","EL UMBRAL","BAJO LA CAL","EL OTRO LADO","LO QUE REGRESA","LA MUESCA","LA FORMA QUE CAMBIA","LO QUE VENDRÁ","EL AGUA ANTIGUA","TODAVÍA","LO QUE QUEDA","HACER SITIO","OTRA LUZ","LA PUERTA ABIERTA","VOLVER A EMPEZAR","EL PORVENIR"];
window.GRANADA_ROWS=[];
</script>

</head>
<body><div id="app"><header><div class="brand"><strong>LA GRANADA DEL 27</strong><small>Un siglo después · 27 × 27 · 56 poemas matriciales</small></div><nav class="modes"><button class="mode active" data-mode="bookview">LIBRO</button><button class="mode" data-mode="verticalreader">VERTICAL</button><button class="mode" data-mode="horizontal">HORIZONTAL</button><button class="mode" data-mode="radial">RADIAL</button></nav><div class="tools"><button class="tool" id="fullBtn" aria-label="Pantalla completa">⛶</button></div></header><main>
<section id="bookview" class="view"><div class="stage"><div class="book"><div class="single on" id="single"><div class="paper"><img id="singleImg" alt="Página"></div></div><div class="spread" id="spread"><div class="paper"><img id="leftImg" alt="Página izquierda"></div><div class="paper"><img id="rightImg" alt="Página derecha"></div></div></div></div><div class="booknav"><button class="navbtn" id="prevBtn">← Anterior</button><div class="progress" id="progress"></div><button class="navbtn" id="nextBtn">Siguiente →</button></div></section>
<section id="verticalreader" class="view hidden"><button class="vmove prev" id="poemPrev">‹</button><button class="vmove next" id="poemNext">›</button><article class="vsheet"><div class="vhead"><div class="vindex" id="vindex"></div><h2 class="vtitle" id="vtitle"></h2></div><div class="vpoem" id="vpoem"></div><div class="vcount">27 versos</div></article></section>
<section id="horizontal" class="view hidden"><div class="rownav"><button id="rowPrev">↑</button><div class="rowlabel" id="rowlabel">H14 / 27</div><button id="rowNext">↓</button></div><div class="hcarousel"><button class="hbtn left" id="versePrev">‹</button><div class="hside left" id="hprev"></div><div class="hcenter"><div class="htitle" id="htitle">BAJO LA CAL</div><div class="hcurrent" id="hcurrent"></div><div class="hpos" id="hpos"></div></div><div class="hside" id="hnext"></div><button class="hbtn right" id="verseNext">›</button></div></section>
<section id="radial" class="view hidden"><div class="radial-stage"><div class="rbranch" id="radialLeft"><div class="rbranch-title">I · HACIA LO ENTERRADO</div></div><div class="rbranch" id="radialRight"><div class="rbranch-title">II · HACIA LO ABIERTO</div></div><div class="radial-head"><span class="num">14</span><span class="title">BAJO LA CAL</span><span class="result">LA GRANADA DEL 27</span></div><div class="rlegend">LECTURA RADIAL · DOS RAMAS</div></div></section>
</main></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const src=n=>`pages/page-${String(n).padStart(2,'0')}.webp`;
const states=[{t:'s',p:1,l:'Portada'}];for(let p=2;p<=37;p+=2)states.push({t:'d',a:p,b:p+1,l:`${p}–${p+1}`});states.push({t:'s',p:38,l:'Contraportada'});
let bi=0,pi=0,row=13,hp=0;
function renderBook(){const s=states[bi];if(s.t==='s'){$('#spread').classList.remove('on');$('#single').classList.add('on');$('#singleImg').src=src(s.p)}else{$('#single').classList.remove('on');$('#spread').classList.add('on');$('#leftImg').src=src(s.a);$('#rightImg').src=src(s.b)}$('#progress').textContent=`${bi+1} / ${states.length} · ${s.l}`;$('#prevBtn').disabled=bi===0;$('#nextBtn').disabled=bi===states.length-1}
function poemVerses(i){return GRANADA_ROWS.map(r=>r.verses[i])}
function renderVertical(){pi=(pi+27)%27;$('#vindex').textContent=`${String(pi+1).padStart(2,'0')} / 27`;$('#vtitle').textContent=GRANADA_TITLES[pi];$('#vpoem').innerHTML='';poemVerses(pi).forEach(t=>{const a=document.createElement('div');a.className='vline';a.textContent=t;$('#vpoem').appendChild(a)});$('#verticalreader').scrollTop=0}
function addRadialRows(el,arr){[...el.querySelectorAll('.rrow')].forEach(n=>n.remove());const marks=['L','A','G','R','A','N','A','D','A','D','E','L','DOS','SIETE'];arr.forEach((t,i)=>{const rr=document.createElement('div');rr.className='rrow';const m=document.createElement('div');m.className='rmark';m.textContent=marks[i];const tx=document.createElement('div');tx.className='rtext';tx.textContent=t;rr.append(m,tx);el.appendChild(rr)})}
function renderRadial(){const v=GRANADA_ROWS[13].verses;const left=[v[13],...v.slice(0,13).reverse()],right=[v[13],...v.slice(14)];addRadialRows($('#radialLeft'),left);addRadialRows($('#radialRight'),right)}
function fitH(){const e=$('#hcurrent'),box=e.parentElement;e.style.fontSize='';let s=parseFloat(getComputedStyle(e).fontSize);while(e.scrollWidth>box.clientWidth-30&&s>20){s--;e.style.fontSize=s+'px'}}
function renderHorizontal(){const o=GRANADA_ROWS[row],n=27;hp=(hp+n)%n;$('#rowlabel').textContent=`H${String(o.row).padStart(2,'0')} / 27`;$('#htitle').textContent=GRANADA_H_TITLES[o.row-1];$('#hpos').textContent=`${String(hp+1).padStart(2,'0')} / 27 · ${GRANADA_TITLES[hp]}`;$('#hcurrent').textContent=o.verses[hp];$('#hprev').textContent=o.verses[(hp+26)%27];$('#hnext').textContent=o.verses[(hp+1)%27];requestAnimationFrame(fitH)}
function mode(m){$$('.view').forEach(v=>v.classList.add('hidden'));$('#'+m).classList.remove('hidden');$$('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));if(m==='bookview')renderBook();if(m==='verticalreader')renderVertical();if(m==='horizontal')renderHorizontal();if(m==='radial')renderRadial();history.replaceState(null,'','#'+m)}
$$('.mode').forEach(b=>b.onclick=()=>mode(b.dataset.mode));$('#prevBtn').onclick=()=>{bi=Math.max(0,bi-1);renderBook()};$('#nextBtn').onclick=()=>{bi=Math.min(states.length-1,bi+1);renderBook()};$('#poemPrev').onclick=()=>{pi--;renderVertical()};$('#poemNext').onclick=()=>{pi++;renderVertical()};$('#rowPrev').onclick=()=>{row=(row+26)%27;hp=0;renderHorizontal()};$('#rowNext').onclick=()=>{row=(row+1)%27;hp=0;renderHorizontal()};$('#versePrev').onclick=()=>{hp--;renderHorizontal()};$('#verseNext').onclick=()=>{hp++;renderHorizontal()};$('#fullBtn').onclick=()=>!document.fullscreenElement?document.documentElement.requestFullscreen?.():document.exitFullscreen?.();window.addEventListener('resize',()=>{if(!$('#horizontal').classList.contains('hidden'))fitH()});renderBook();renderVertical();renderHorizontal();renderRadial();const h=location.hash.slice(1);if(['bookview','verticalreader','horizontal','radial'].includes(h))mode(h);
</script></body></html>
