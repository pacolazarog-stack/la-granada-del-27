<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171512">
<title>La Granada del 27 · Un siglo después</title>
<style>
:root{--bg:#171512;--bg2:#100f0d;--paper:#f4eee4;--ink:#211d19;--line:rgba(255,255,255,.18);--muted:#b9ad9f}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#f5efe7;font-family:Georgia,"Times New Roman",serif}
button{font:inherit;cursor:pointer}.hidden{display:none!important}
#entry{position:fixed;inset:0;z-index:100;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,500px);align-items:center;gap:5vw;padding:clamp(24px,6vw,88px);background:radial-gradient(circle at 73% 40%,rgba(168,124,72,.22),transparent 34%),linear-gradient(120deg,#171512,#252019 58%,#0e0d0b)}
#entry.hide{display:none}.kicker{letter-spacing:.22em;font-size:12px;color:#d5c6b2;margin-bottom:22px}.entry-copy h1{font-size:clamp(44px,7vw,90px);line-height:.93;font-weight:400;margin:0}.entry-copy h1 span{display:block;font-size:.42em;font-style:italic;color:#d4c6b6;margin-top:18px}.entry-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}.pill{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:11px 18px}.pill:hover{background:#efe6db;color:#201a16}.cover{justify-self:end;height:min(72vh,730px);aspect-ratio:148/210;filter:drop-shadow(0 26px 42px rgba(0,0,0,.55));transform:rotateY(-5deg) rotateZ(1deg)}.cover img{width:100%;height:100%;object-fit:cover;display:block}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;background:radial-gradient(circle at 50% 10%,rgba(150,110,72,.14),transparent 40%),linear-gradient(135deg,#1a1714,#0f0e0d 72%)}
header{display:grid;grid-template-columns:minmax(210px,1fr) auto minmax(80px,1fr);align-items:center;gap:18px;padding:11px 18px;border-bottom:1px solid var(--line);background:#15120f;z-index:30}
.brand strong{display:block;font-size:14px;letter-spacing:.08em;font-weight:400;white-space:nowrap}.brand small{display:block;color:#b8aa9c;font-size:11px;margin-top:3px;white-space:nowrap}
.modes{display:flex;gap:8px;justify-content:center}.mode{border:1px solid rgba(255,255,255,.32);background:#211d19;color:#efe8df;border-radius:999px;padding:9px 16px;font-size:12px;letter-spacing:.08em;white-space:nowrap}.mode.active{background:#efe6db;color:#211c18;border-color:#efe6db}.tools{justify-self:end}.tool{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:#211d19;color:#fff}
main,.view{min-height:0;height:100%;overflow:hidden}
.bookview{display:grid;grid-template-rows:minmax(0,1fr) auto}.stage{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px 24px;perspective:2400px}.book{position:relative;width:min(94vw,1360px);height:100%;display:flex;align-items:center;justify-content:center}.single,.spread{position:absolute;inset:0;display:none;align-items:center;justify-content:center}.single.on,.spread.on{display:flex}.paper{height:min(96%,820px);aspect-ratio:148/210;background:#fff;box-shadow:0 18px 42px rgba(0,0,0,.42);overflow:hidden}.paper img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}.spread-inner{height:min(96%,820px);display:grid;grid-template-columns:auto auto;filter:drop-shadow(0 20px 30px rgba(0,0,0,.36))}.spread .paper{height:100%;box-shadow:none}.navzone{position:absolute;top:0;bottom:0;width:22%;z-index:5}.navzone.prev{left:0}.navzone.next{right:0}.bottom{display:flex;justify-content:center;align-items:center;gap:12px;padding:10px 16px 15px}.navbtn{border:1px solid rgba(255,255,255,.28);background:#211d19;color:#fff;border-radius:999px;padding:9px 14px}.navbtn:disabled{opacity:.3;cursor:default}.progress{min-width:155px;text-align:center;color:#cfc3b7;font-size:12px;letter-spacing:.08em}
.verticalreader{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(120,90,60,.08),transparent 38%),#100f0d}.vnav{position:absolute;z-index:5;inset:0;display:grid;grid-template-columns:58px minmax(0,1fr) 58px;pointer-events:none}.vmove{pointer-events:auto;border:0;background:linear-gradient(90deg,rgba(12,11,10,.90),rgba(12,11,10,0));color:#efe5da;font-size:32px}.vmove.next{background:linear-gradient(270deg,rgba(12,11,10,.90),rgba(12,11,10,0))}.vscroll{height:100%;overflow:auto;padding:28px 78px 36px}.vsheet{width:min(800px,100%);margin:0 auto;background:var(--paper);color:var(--ink);padding:32px clamp(26px,4vw,54px) 38px;box-shadow:0 18px 42px rgba(0,0,0,.28)}.vhead{text-align:center;margin-bottom:20px}.vindex{font-size:11px;letter-spacing:.18em;color:#8c7e70;margin-bottom:8px}.vtitle{font-size:clamp(22px,2.2vw,34px);font-weight:400;line-height:1.15;margin:0}.vpoem-grid{display:grid;grid-template-columns:minmax(0,1fr) 56px;column-gap:20px;align-items:start}.vpoem{display:grid;gap:4px}.vline{font-size:clamp(14px,1.18vw,18px);line-height:1.28;white-space:nowrap}.vtelcol{display:grid;gap:4px;border-left:3px solid #8b2f2a;background:rgba(139,47,42,.09);padding:0 10px}.vtelrow{font-size:clamp(14px,1.18vw,18px);line-height:1.28;height:1.28em;display:flex;align-items:baseline;justify-content:center;color:#8b2f2a;font-weight:700;text-transform:uppercase}.vcount{text-align:center;margin-top:20px;font-size:11px;letter-spacing:.16em;color:#8c7e70}
.horizontal{position:relative;background:radial-gradient(circle at 50% 48%,rgba(124,92,60,.10),transparent 38%),linear-gradient(180deg,#171512,#100f0d)}.rownav{position:absolute;z-index:8;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:9px;background:rgba(22,18,15,.90);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:5px 7px;backdrop-filter:blur(10px)}.rownav button{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#f5eee6;font-size:18px}.rowlabel{min-width:76px;text-align:center;font-size:12px;letter-spacing:.16em;color:#d9cec2}.hcarousel{position:absolute;inset:0;display:grid;grid-template-columns:54px minmax(0,1fr) minmax(520px,52vw) minmax(0,1fr) 54px;align-items:center;gap:clamp(12px,2vw,30px);padding:78px clamp(12px,2vw,30px) 46px;overflow:hidden}.hstep{width:48px;height:72px;align-self:center;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(20,17,14,.54);color:#eadfd4;font-size:34px;display:grid;place-items:center}.hside{min-width:0;white-space:nowrap;overflow:hidden;font-size:clamp(16px,1.25vw,22px);line-height:1.2;color:#c8bbae;opacity:.36}.hside-left{text-align:right;mask-image:linear-gradient(to right,transparent 0,#000 38%);-webkit-mask-image:linear-gradient(to right,transparent 0,#000 38%)}.hside-right{text-align:left;mask-image:linear-gradient(to left,transparent 0,#000 38%);-webkit-mask-image:linear-gradient(to left,transparent 0,#000 38%)}.hcenter-wrap{min-width:0;display:grid;place-items:center;align-content:center;gap:22px;text-align:center;padding:34px clamp(16px,2vw,34px);border-top:1px solid rgba(255,255,255,.10);border-bottom:1px solid rgba(255,255,255,.10)}.hcurrent{width:100%;white-space:nowrap;font-size:clamp(30px,2.7vw,46px);line-height:1.14;color:#f7efe6;letter-spacing:-.012em}.hpos{font-size:11px;letter-spacing:.18em;color:#8f8174}
.radial{overflow:auto;background:#100f0d;padding:clamp(18px,3vw,34px)}.radial-stage{width:min(1180px,100%);min-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,56px);align-items:start}.rpoem{background:var(--paper);color:var(--ink);padding:clamp(30px,4vw,58px) clamp(28px,4vw,56px);box-shadow:0 18px 44px rgba(0,0,0,.34)}.rline{font-size:clamp(18px,1.5vw,25px);line-height:1.62;margin:0 0 .48em}.rline:first-child{margin-bottom:1.15em}
@media(max-width:1050px){.hcarousel{grid-template-columns:46px minmax(0,1fr) 46px;gap:12px;padding:78px 14px 36px}.hside{display:none}.hcenter-wrap{grid-column:2;padding-inline:14px}.hstep-left{grid-column:1}.hstep-right{grid-column:3}.hcurrent{font-size:clamp(25px,4vw,36px)}}
@media(max-width:900px){header{grid-template-columns:1fr auto;grid-template-areas:"brand tools" "modes modes";gap:8px 10px;padding:9px 12px}.brand{grid-area:brand}.brand small{display:none}.modes{grid-area:modes;justify-content:flex-start;overflow-x:auto}.tools{grid-area:tools}.mode{padding:7px 11px;font-size:10px}.vscroll{padding:20px 54px 30px}.vline,.vtelrow{font-size:14px}}
@media(max-width:580px){#entry{grid-template-columns:1fr;text-align:center;overflow:auto}.cover{justify-self:center;height:min(48vh,470px);order:-1}.entry-actions{justify-content:center}.tool{width:32px;height:32px}.vnav{grid-template-columns:42px minmax(0,1fr) 42px}.vscroll{padding:16px 44px 24px}.vsheet{padding:26px 18px 30px}.vpoem-grid{grid-template-columns:minmax(0,1fr) 42px;column-gap:10px}.vline,.vtelrow{font-size:13px}.vline{white-space:normal}.vtelcol{padding:0 6px}.hcarousel{grid-template-columns:38px minmax(0,1fr) 38px;padding:70px 8px 26px;gap:7px}.hstep{width:36px;height:56px;font-size:26px}.hcenter-wrap{padding:24px 6px;gap:16px}.hcurrent{font-size:24px}.radial{padding:12px}.radial-stage{min-width:700px;gap:16px}.rpoem{padding:28px 30px}.rline{font-size:18px}}
</style>
<script src="matrix-core.js"></script><script src="matrix-1.js"></script><script src="matrix-2.js"></script><script src="matrix-3.js"></script>
</head>
<body>
<section id="entry"><div class="entry-copy"><div class="kicker">POEMARIO</div><h1>La Granada del 27<span>Un siglo después</span></h1><div class="entry-actions"><button class="pill" data-enter="bookview">Libro</button><button class="pill" data-enter="verticalreader">Vertical</button><button class="pill" data-enter="radial">Radial</button><button class="pill" data-enter="horizontal">Horizontal</button></div></div><div class="cover"><img src="pages/page-01.webp" alt="Portada"></div></section>
<div id="app"><header><div class="brand"><strong>LA GRANADA DEL 27</strong><small>Un siglo después</small></div><nav class="modes" aria-label="Modo de lectura"><button class="mode active" data-mode="bookview">LIBRO</button><button class="mode" data-mode="verticalreader">VERTICAL</button><button class="mode" data-mode="radial">RADIAL</button><button class="mode" data-mode="horizontal">HORIZONTAL</button></nav><div class="tools"><button class="tool" id="fullBtn" title="Pantalla completa">⛶</button></div></header><main>
<section id="bookview" class="view bookview"><div class="stage" id="stage"><div class="book"><div class="navzone prev" id="prevZone"></div><div class="navzone next" id="nextZone"></div><div class="single on" id="single"><div class="paper"><img id="singleImg" src="pages/page-01.webp" alt="Página"></div></div><div class="spread" id="spread"><div class="spread-inner"><div class="paper"><img id="leftImg" alt="Página izquierda"></div><div class="paper"><img id="rightImg" alt="Página derecha"></div></div></div></div></div><div class="bottom"><button class="navbtn" id="prevBtn">← Anterior</button><div class="progress" id="progress"></div><button class="navbtn" id="nextBtn">Siguiente →</button></div></section>
<section id="verticalreader" class="view verticalreader hidden"><div class="vnav"><button class="vmove prev" id="poemPrev" aria-label="Poema anterior">‹</button><div></div><button class="vmove next" id="poemNext" aria-label="Poema siguiente">›</button></div><div class="vscroll" id="vscroll"><article class="vsheet"><div class="vhead"><div class="vindex" id="vindex"></div><h2 class="vtitle" id="vtitle"></h2></div><div class="vpoem-grid"><div class="vpoem" id="vpoem"></div><div class="vtelcol" id="vtelcol" aria-hidden="true"></div></div><div class="vcount" id="vcount"></div></article></div></section>
<section id="horizontal" class="view horizontal hidden"><div class="rownav"><button id="rowPrev" aria-label="Lectura horizontal anterior">↑</button><div class="rowlabel" id="rowlabel">14 / 27</div><button id="rowNext" aria-label="Lectura horizontal siguiente">↓</button></div><div class="hcarousel" id="hcarousel"><button class="hstep hstep-left" id="versePrev" aria-label="Verso anterior">‹</button><div class="hside hside-left" id="hprev"></div><div class="hcenter-wrap"><div class="hcurrent" id="hcurrent"></div><div class="hpos" id="hpos">01 / 27</div></div><div class="hside hside-right" id="hnext"></div><button class="hstep hstep-right" id="verseNext" aria-label="Verso siguiente">›</button></div></section>
<section id="radial" class="view radial hidden"><div class="radial-stage"><div class="rpoem" id="radialLeft"></div><div class="rpoem" id="radialRight"></div></div></section>
</main></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const states=[{type:'single',page:1,label:'Portada'}];for(let p=2;p<=37;p+=2)states.push({type:'spread',left:p,right:p+1,label:`${p}–${p+1}`});states.push({type:'single',page:38,label:'Contraportada'});
let pageState=0,poemPos=0,row=13,hpos=0,touchX=0;const pageSrc=n=>`pages/page-${String(n).padStart(2,'0')}.webp`;
function renderBook(){const st=states[pageState];if(st.type==='single'){$('#spread').classList.remove('on');$('#single').classList.add('on');$('#singleImg').src=pageSrc(st.page)}else{$('#single').classList.remove('on');$('#spread').classList.add('on');$('#leftImg').src=pageSrc(st.left);$('#rightImg').src=pageSrc(st.right)}$('#progress').textContent=`${pageState+1} / ${states.length} · ${st.label}`;$('#prevBtn').disabled=pageState===0;$('#nextBtn').disabled=pageState===states.length-1}
function goPage(d){pageState=Math.max(0,Math.min(states.length-1,pageState+d));renderBook()}
function poemVerses(i){return GRANADA_ROWS.map(r=>r.verses[i])}
function renderVerticalReader(){poemPos=(poemPos+27)%27;$('#vindex').textContent=`${String(poemPos+1).padStart(2,'0')} / 27`;$('#vtitle').textContent=GRANADA_TITLES[poemPos];const box=$('#vpoem'),telbox=$('#vtelcol');box.innerHTML='';telbox.innerHTML='';poemVerses(poemPos).forEach(t=>{const d=document.createElement('div');d.className='vline';d.textContent=t;box.appendChild(d);const m=t.match(/([A-Za-zÁÉÍÓÚÜÑáéíóúüñ])(?=[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ]*$)/);const tel=document.createElement('div');tel.className='vtelrow';tel.textContent=m?m[1]:'';telbox.appendChild(tel)});$('#vcount').textContent='27 versos';$('#vscroll').scrollTop=0}
function setMode(mode){$$('.view').forEach(v=>v.classList.add('hidden'));$('#'+mode).classList.remove('hidden');$$('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));if(mode==='bookview')renderBook();if(mode==='verticalreader')renderVerticalReader();if(mode==='horizontal')renderHorizontal();if(mode==='radial')renderRadial();history.replaceState(null,'','#'+mode)}
function fitHorizontalCurrent(){const el=$('#hcurrent'),box=el.parentElement;el.style.fontSize='';let size=parseFloat(getComputedStyle(el).fontSize),max=Math.max(240,box.clientWidth-24);while(el.scrollWidth>max&&size>20){size-=1;el.style.fontSize=size+'px'}}
function renderHorizontal(){const obj=GRANADA_ROWS[row],n=obj.verses.length;hpos=(hpos+n)%n;const prev=(hpos+n-1)%n,next=(hpos+1)%n;$('#rowlabel').textContent=`${String(obj.row).padStart(2,'0')} / 27`;$('#hpos').textContent=`${String(hpos+1).padStart(2,'0')} / 27`;$('#hprev').textContent=obj.verses[prev];$('#hcurrent').textContent=obj.verses[hpos];$('#hnext').textContent=obj.verses[next];requestAnimationFrame(fitHorizontalCurrent)}
function renderRadial(){const v=GRANADA_ROWS[13].verses,left=[v[13],...v.slice(0,13).reverse()],right=[v[13],...v.slice(14)];const fill=(el,arr)=>{el.innerHTML='';arr.forEach(t=>{const d=document.createElement('div');d.className='rline';d.textContent=t;el.appendChild(d)})};fill($('#radialLeft'),left);fill($('#radialRight'),right)}
$$('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$$('[data-enter]').forEach(b=>b.onclick=()=>{$('#entry').classList.add('hide');localStorage.setItem('granada27-entered','1');setMode(b.dataset.enter)});
const initialHash=location.hash.replace('#',''),modes=['bookview','verticalreader','horizontal','radial'];if(localStorage.getItem('granada27-entered')||modes.includes(initialHash))$('#entry').classList.add('hide');
$('#prevBtn').onclick=()=>goPage(-1);$('#nextBtn').onclick=()=>goPage(1);$('#prevZone').onclick=()=>goPage(-1);$('#nextZone').onclick=()=>goPage(1);$('#stage').addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});$('#stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>55)goPage(dx<0?1:-1)},{passive:true});
$('#poemPrev').onclick=()=>{poemPos=(poemPos+26)%27;renderVerticalReader()};$('#poemNext').onclick=()=>{poemPos=(poemPos+1)%27;renderVerticalReader()};
$('#rowPrev').onclick=()=>{row=(row+26)%27;hpos=0;renderHorizontal()};$('#rowNext').onclick=()=>{row=(row+1)%27;hpos=0;renderHorizontal()};$('#versePrev').onclick=()=>{hpos=(hpos+26)%27;renderHorizontal()};$('#verseNext').onclick=()=>{hpos=(hpos+1)%27;renderHorizontal()};
let hTouchX=0;$('#hcarousel').addEventListener('pointerdown',e=>{hTouchX=e.clientX});$('#hcarousel').addEventListener('pointerup',e=>{const dx=e.clientX-hTouchX;if(Math.abs(dx)>55){hpos=(hpos+(dx<0?1:26))%27;renderHorizontal()}});
$('#fullBtn').onclick=()=>!document.fullscreenElement?document.documentElement.requestFullscreen?.():document.exitFullscreen?.();
document.addEventListener('keydown',e=>{const mode=$('.mode.active')?.dataset.mode;if(mode==='bookview'){if(e.key==='ArrowRight')goPage(1);if(e.key==='ArrowLeft')goPage(-1)}else if(mode==='verticalreader'){if(e.key==='ArrowRight'){poemPos=(poemPos+1)%27;renderVerticalReader()}if(e.key==='ArrowLeft'){poemPos=(poemPos+26)%27;renderVerticalReader()}}else if(mode==='horizontal'){if(e.key==='ArrowDown'){row=(row+1)%27;hpos=0;renderHorizontal()}if(e.key==='ArrowUp'){row=(row+26)%27;hpos=0;renderHorizontal()}if(e.key==='ArrowRight'){hpos=(hpos+1)%27;renderHorizontal()}if(e.key==='ArrowLeft'){hpos=(hpos+26)%27;renderHorizontal()}}});
window.addEventListener('resize',()=>{if(!$('#horizontal').classList.contains('hidden'))fitHorizontalCurrent()});
renderBook();renderVerticalReader();renderHorizontal();renderRadial();if(modes.includes(initialHash))setMode(initialHash);
</script>
</body></html>
