<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171512">
<title>La Granada del 27 · Un siglo después</title>
<style>
:root{
  --bg:#171512;--bg2:#0f0e0d;--paper:#f4eee4;--ink:#211d19;
  --line:rgba(255,255,255,.18);--accent:#8b2f2a;--muted:#b9ad9f
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#f5efe7;font-family:Georgia,"Times New Roman",serif}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

#entry{position:fixed;inset:0;z-index:100;display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,500px);align-items:center;gap:5vw;padding:clamp(24px,6vw,88px);background:radial-gradient(circle at 73% 40%,rgba(168,124,72,.22),transparent 34%),linear-gradient(120deg,#171512,#252019 58%,#0e0d0b)}
#entry.hide{display:none}
.kicker{letter-spacing:.22em;font-size:12px;color:#d5c6b2;margin-bottom:22px}
.entry-copy h1{font-size:clamp(44px,7vw,90px);line-height:.93;font-weight:400;margin:0}
.entry-copy h1 span{display:block;font-size:.42em;font-style:italic;color:#d4c6b6;margin-top:18px}
.entry-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.pill{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:999px;padding:11px 18px}
.pill:hover{background:#efe6db;color:#201a16}
.cover{justify-self:end;height:min(72vh,730px);aspect-ratio:148/210;filter:drop-shadow(0 26px 42px rgba(0,0,0,.55));transform:rotateY(-5deg) rotateZ(1deg)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;background:radial-gradient(circle at 50% 10%,rgba(150,110,72,.14),transparent 40%),linear-gradient(135deg,#1a1714,#0f0e0d 72%)}
header{display:grid;grid-template-columns:minmax(210px,1fr) auto minmax(80px,1fr);align-items:center;gap:18px;padding:11px 18px;border-bottom:1px solid var(--line);background:#15120f;z-index:30}
.brand strong{display:block;font-size:14px;letter-spacing:.08em;font-weight:400;white-space:nowrap}
.brand small{display:block;color:#b8aa9c;font-size:11px;margin-top:3px;white-space:nowrap}
.modes{display:flex;gap:8px;justify-content:center}
.mode{border:1px solid rgba(255,255,255,.32);background:#211d19;color:#efe8df;border-radius:999px;padding:9px 16px;font-size:12px;letter-spacing:.08em;white-space:nowrap}
.mode.active{background:#efe6db;color:#211c18;border-color:#efe6db}
.tools{justify-self:end}
.tool{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:#211d19;color:#fff}
main,.view{min-height:0;height:100%;overflow:hidden}

.vertical{display:grid;grid-template-rows:minmax(0,1fr) auto}
.stage{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px 24px;perspective:2400px}
.book{position:relative;width:min(94vw,1360px);height:100%;display:flex;align-items:center;justify-content:center}
.single,.spread{position:absolute;inset:0;display:none;align-items:center;justify-content:center}
.single.on,.spread.on{display:flex}
.paper{height:min(96%,820px);aspect-ratio:148/210;background:#fff;box-shadow:0 18px 42px rgba(0,0,0,.42);overflow:hidden}
.paper img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.spread-inner{height:min(96%,820px);display:grid;grid-template-columns:auto auto;filter:drop-shadow(0 20px 30px rgba(0,0,0,.36))}
.spread .paper{height:100%;box-shadow:none}
.navzone{position:absolute;top:0;bottom:0;width:22%;z-index:5}
.navzone.prev{left:0}.navzone.next{right:0}
.bottom{display:flex;justify-content:center;align-items:center;gap:12px;padding:10px 16px 15px}
.navbtn{border:1px solid rgba(255,255,255,.28);background:#211d19;color:#fff;border-radius:999px;padding:9px 14px}
.navbtn:disabled{opacity:.3;cursor:default}
.progress{min-width:155px;text-align:center;color:#cfc3b7;font-size:12px;letter-spacing:.08em}

.horizontal{position:relative;background:#100f0d}
.rownav{position:absolute;z-index:7;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(22,18,15,.88);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:5px 7px;backdrop-filter:blur(10px)}
.rownav button{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#f5eee6;font-size:18px}
.rowlabel{min-width:76px;text-align:center;font-size:12px;letter-spacing:.16em;color:#d9cec2}
.hviewport{position:absolute;inset:0;display:grid;grid-template-columns:42px minmax(0,1fr) 42px;align-items:stretch}
.hscrollbtn{z-index:5;border:0;background:linear-gradient(90deg,rgba(12,11,10,.97),rgba(12,11,10,.45));color:#eee4d8;font-size:30px}
.hscrollbtn.right{background:linear-gradient(270deg,rgba(12,11,10,.97),rgba(12,11,10,.45))}
.hscroll{min-width:0;height:100%;overflow-x:auto;overflow-y:hidden;display:flex;align-items:center;scroll-behavior:smooth;overscroll-behavior-x:contain;background:var(--paper)}
.hscroll::-webkit-scrollbar{height:10px}.hscroll::-webkit-scrollbar-track{background:#e9dfd2}.hscroll::-webkit-scrollbar-thumb{background:#9d8d7c;border-radius:999px;border:2px solid #e9dfd2}
.hverse{flex:0 0 clamp(320px,27vw,470px);padding:0 clamp(32px,4vw,64px);font-size:clamp(24px,2.15vw,36px);line-height:1.38;color:var(--ink);display:flex;align-items:center;min-height:62%;position:relative}
.hverse:not(:last-child)::after{content:"";position:absolute;right:0;top:28%;bottom:28%;width:1px;background:rgba(55,44,35,.10)}

.radial{overflow:auto;background:#100f0d;padding:clamp(18px,3vw,34px)}
.radial-stage{width:min(1180px,100%);min-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,4vw,56px);align-items:start}
.rpoem{background:var(--paper);color:var(--ink);padding:clamp(30px,4vw,58px) clamp(28px,4vw,56px);box-shadow:0 18px 44px rgba(0,0,0,.34)}
.rline{font-size:clamp(18px,1.5vw,25px);line-height:1.62;margin:0 0 .48em}
.rline:first-child{margin-bottom:1.15em}

@media(max-width:900px){
  header{grid-template-columns:1fr auto;grid-template-areas:"brand tools" "modes modes";gap:8px 10px;padding:9px 12px}
  .brand{grid-area:brand}.brand small{display:none}.modes{grid-area:modes;justify-content:flex-start;overflow-x:auto}.tools{grid-area:tools}
  .mode{padding:7px 11px;font-size:10px}
  .hviewport{grid-template-columns:34px minmax(0,1fr) 34px}.hscrollbtn{font-size:24px}
  .hverse{flex-basis:min(78vw,390px);font-size:25px}
}
@media(max-width:580px){
  #entry{grid-template-columns:1fr;text-align:center;overflow:auto}.cover{justify-self:center;height:min(48vh,470px);order:-1}.entry-actions{justify-content:center}
  .tool{width:32px;height:32px}
  .radial{padding:12px;overflow:auto}.radial-stage{min-width:700px;gap:16px}.rpoem{padding:28px 30px}.rline{font-size:18px}
}
</style>
<script src="matrix-core.js"></script>
<script src="matrix-1.js"></script>
<script src="matrix-2.js"></script>
<script src="matrix-3.js"></script>
</head>
<body>

<section id="entry">
  <div class="entry-copy">
    <div class="kicker">POEMARIO</div>
    <h1>La Granada del 27<span>Un siglo después</span></h1>
    <div class="entry-actions">
      <button class="pill" data-enter="vertical">Vertical</button>
      <button class="pill" data-enter="horizontal">Horizontal</button>
      <button class="pill" data-enter="radial">Radial</button>
    </div>
  </div>
  <div class="cover"><img src="pages/page-01.webp" alt="Portada"></div>
</section>

<div id="app">
  <header>
    <div class="brand"><strong>LA GRANADA DEL 27</strong><small>Un siglo después</small></div>
    <nav class="modes" aria-label="Modo de lectura">
      <button class="mode active" data-mode="vertical">VERTICAL</button>
      <button class="mode" data-mode="horizontal">HORIZONTAL</button>
      <button class="mode" data-mode="radial">RADIAL</button>
    </nav>
    <div class="tools"><button class="tool" id="fullBtn" title="Pantalla completa">⛶</button></div>
  </header>

  <main>
    <section id="vertical" class="view vertical">
      <div class="stage" id="stage">
        <div class="book">
          <div class="navzone prev" id="prevZone"></div>
          <div class="navzone next" id="nextZone"></div>
          <div class="single on" id="single"><div class="paper"><img id="singleImg" src="pages/page-01.webp" alt="Página"></div></div>
          <div class="spread" id="spread"><div class="spread-inner"><div class="paper"><img id="leftImg" alt="Página izquierda"></div><div class="paper"><img id="rightImg" alt="Página derecha"></div></div></div>
        </div>
      </div>
      <div class="bottom">
        <button class="navbtn" id="prevBtn">← Anterior</button>
        <div class="progress" id="progress"></div>
        <button class="navbtn" id="nextBtn">Siguiente →</button>
      </div>
    </section>

    <section id="horizontal" class="view horizontal hidden">
      <div class="rownav">
        <button id="rowPrev" aria-label="Lectura anterior">↑</button>
        <div class="rowlabel" id="rowlabel">14 / 27</div>
        <button id="rowNext" aria-label="Lectura siguiente">↓</button>
      </div>
      <div class="hviewport">
        <button class="hscrollbtn" id="scrollLeft" aria-label="Desplazar a la izquierda">‹</button>
        <div class="hscroll" id="hscroll"></div>
        <button class="hscrollbtn right" id="scrollRight" aria-label="Desplazar a la derecha">›</button>
      </div>
    </section>

    <section id="radial" class="view radial hidden">
      <div class="radial-stage">
        <div class="rpoem" id="radialLeft"></div>
        <div class="rpoem" id="radialRight"></div>
      </div>
    </section>
  </main>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const states=[{type:'single',page:1,label:'Portada'}];
for(let p=2;p<=37;p+=2)states.push({type:'spread',left:p,right:p+1,label:`${p}–${p+1}`});
states.push({type:'single',page:38,label:'Contraportada'});
let pageState=0,row=13,touchX=0;
const pageSrc=n=>`pages/page-${String(n).padStart(2,'0')}.webp`;

function renderVertical(){
  const st=states[pageState];
  if(st.type==='single'){
    $('#spread').classList.remove('on');$('#single').classList.add('on');$('#singleImg').src=pageSrc(st.page);
  }else{
    $('#single').classList.remove('on');$('#spread').classList.add('on');$('#leftImg').src=pageSrc(st.left);$('#rightImg').src=pageSrc(st.right);
  }
  $('#progress').textContent=`${pageState+1} / ${states.length} · ${st.label}`;
  $('#prevBtn').disabled=pageState===0;$('#nextBtn').disabled=pageState===states.length-1;
}
function goPage(d){pageState=Math.max(0,Math.min(states.length-1,pageState+d));renderVertical()}

function setMode(mode){
  $$('.view').forEach(v=>v.classList.add('hidden'));
  $('#'+mode).classList.remove('hidden');
  $$('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  if(mode==='horizontal')renderHorizontal();
  if(mode==='radial')renderRadial();
  history.replaceState(null,'','#'+mode);
}

function renderHorizontal(){
  const obj=GRANADA_ROWS[row], sc=$('#hscroll');
  $('#rowlabel').textContent=`${String(obj.row).padStart(2,'0')} / 27`;
  sc.innerHTML='';
  obj.verses.forEach(v=>{
    const d=document.createElement('div');
    d.className='hverse';
    d.textContent=v;
    sc.appendChild(d);
  });
  sc.scrollLeft=0;
}

function renderRadial(){
  const v=GRANADA_ROWS[13].verses;
  const left=[v[13],...v.slice(0,13).reverse()];
  const right=[v[13],...v.slice(14)];
  const fill=(el,arr)=>{
    el.innerHTML='';
    arr.forEach(t=>{
      const line=document.createElement('div');
      line.className='rline';
      line.textContent=t;
      el.appendChild(line);
    });
  };
  fill($('#radialLeft'),left);
  fill($('#radialRight'),right);
}

$$('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$$('[data-enter]').forEach(b=>b.onclick=()=>{
  $('#entry').classList.add('hide');
  localStorage.setItem('granada27-entered','1');
  setMode(b.dataset.enter);
});
const initialHash=location.hash.replace('#','');
if(localStorage.getItem('granada27-entered') || ['vertical','horizontal','radial'].includes(initialHash)) $('#entry').classList.add('hide');

$('#prevBtn').onclick=()=>goPage(-1);$('#nextBtn').onclick=()=>goPage(1);
$('#prevZone').onclick=()=>goPage(-1);$('#nextZone').onclick=()=>goPage(1);
$('#stage').addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});
$('#stage').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>55)goPage(dx<0?1:-1)},{passive:true});

$('#rowPrev').onclick=()=>{row=(row+26)%27;renderHorizontal()};
$('#rowNext').onclick=()=>{row=(row+1)%27;renderHorizontal()};
$('#scrollLeft').onclick=()=>$('#hscroll').scrollBy({left:-Math.max(320,innerWidth*.7),behavior:'smooth'});
$('#scrollRight').onclick=()=>$('#hscroll').scrollBy({left:Math.max(320,innerWidth*.7),behavior:'smooth'});
$('#hscroll').addEventListener('wheel',e=>{
  if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();$('#hscroll').scrollLeft+=e.deltaY;}
},{passive:false});

let drag=false,startX=0,startScroll=0;
$('#hscroll').addEventListener('pointerdown',e=>{drag=true;startX=e.clientX;startScroll=$('#hscroll').scrollLeft;$('#hscroll').setPointerCapture?.(e.pointerId)});
$('#hscroll').addEventListener('pointermove',e=>{if(drag)$('#hscroll').scrollLeft=startScroll-(e.clientX-startX)});
$('#hscroll').addEventListener('pointerup',()=>drag=false);
$('#hscroll').addEventListener('pointercancel',()=>drag=false);

$('#fullBtn').onclick=()=>!document.fullscreenElement?document.documentElement.requestFullscreen?.():document.exitFullscreen?.();

document.addEventListener('keydown',e=>{
  const mode=$('.mode.active')?.dataset.mode;
  if(mode==='vertical'){
    if(e.key==='ArrowRight')goPage(1);if(e.key==='ArrowLeft')goPage(-1);
  }else if(mode==='horizontal'){
    if(e.key==='ArrowDown'){row=(row+1)%27;renderHorizontal()}
    if(e.key==='ArrowUp'){row=(row+26)%27;renderHorizontal()}
    if(e.key==='ArrowRight')$('#hscroll').scrollBy({left:420,behavior:'smooth'});
    if(e.key==='ArrowLeft')$('#hscroll').scrollBy({left:-420,behavior:'smooth'});
  }
});

renderVertical();renderHorizontal();renderRadial();
if(['vertical','horizontal','radial'].includes(initialHash))setMode(initialHash);
</script>
</body>
</html>
