/header><main class="work author-page memorial-page"><a class="back" href="final.html">← Cierre del volumen</a><div class="memorial-reader"><section class="memorial-sheet" data-memorial-page="1"><h1 class="memorial-name">Friedhelm Erwin Grube Groth</h1><div class="memorial-subtitle">in memoriam</div><div class="memorial-image-wrap"><img class="memorial-image" src="images/Dyl_Ulenspiegel.jpg" width="522" height="800" alt="Dyl Ulenspiegel, grabado de 1515" loading="eager"></div></section><section class="memorial-sheet" data-memorial-page="2" hidden><div class="memorial-gallery-wrap"><img class="memorial-gallery" src="images/fli_pagina_2.png" width="1055" height="1491" alt="Segunda página visual del homenaje a Fli con fotografías escénicas y dibujo" loading="eager"></div></section><div class="memorial-nav" aria-label="Navegación del memorial"><button type="button" id="fliPrev" disabled>← Anterior</button><span class="memorial-count" id="fliCount">1 / 2</span><button type="button" id="fliNext">Siguiente →</button></div></div></main></div><script src="audio-preference.js?v=20260916-return7"></script><script src="voice-reader.js?v=20260916-voice3"></script><script>(()=>{const pages=[...document.querySelectorAll('[data-memorial-page]')],prev=document.querySelector('#fliPrev'),next=document.querySelector('#fliNext'),count=document.querySelector('#fliCount');let i=location.hash==='#p2'?1:0;const render=()=>{pages.forEach((p,n)=>p.hidden=n!==i);prev.disabled=i===0;next.disabled=i===pages.length-1;count.textContent=`${i+1} / ${pages.length}`;history.replaceState(null,'',i?'#p2':'#p1');document.dispatchEvent(new CustomEvent('book:state',{detail:{state:'fli',page:i+1,total:pages.length}}));};prev.onclick=()=>{if(i>0){i--;render();}};next.onclick=()=>{if(i<pages.length-1){i++;render();}};addEventListener('keydown',e=>{if(e.key==='ArrowLeft'&&i>0){i--;render();}else if(e.key==='ArrowRight'&&i<pages.length-1){i++;render();}});render();})();</script></body></html>
