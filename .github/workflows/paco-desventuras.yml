name: Paco · desventuras
on:
  push:
    paths:
      - '.github/workflows/paco-desventuras.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sustituir solo en Paco
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['paco.html','paco-data.js']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('DESGRACIAS','DESVENTURAS').replace('desgracias','desventuras')
              p.write_text(s)
          p=Path('paco.html')
          s=p.read_text().replace('paco-data.js?v=20260915g','paco-data.js?v=20260916-desventuras1')
          p.write_text(s)
          PY
      - name: Verificar
        run: |
          set -euo pipefail
          ! grep -qi 'desgracias' paco.html
          ! grep -qi 'desgracias' paco-data.js
          grep -qi 'desventuras' paco.html
          grep -qi 'desventuras' paco-data.js
      - name: Publicar y retirar parche temporal
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paco.html paco-data.js
          git rm '.github/workflows/paco-desventuras.yml'
          git commit -m 'Paco: desgracias pasa a desventuras'
          git push
