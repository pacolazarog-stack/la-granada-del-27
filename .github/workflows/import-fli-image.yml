name: Importar imagen Fli

on:
  push:
    paths:
      - '.github/workflows/import-fli-image.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar imagen histórica exacta
        run: |
          set -euo pipefail
          mkdir -p images
          curl -L --fail --retry 3 --retry-delay 1 \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/Dyl_Ulenspiegel.jpg' \
            -o 'images/Dyl_Ulenspiegel.jpg'
      - name: Verificar imagen
        run: |
          set -euo pipefail
          test "$(stat -c%s 'images/Dyl_Ulenspiegel.jpg')" = '311043'
          test "$(sha1sum 'images/Dyl_Ulenspiegel.jpg' | awk '{print $1}')" = '2ed08fcfe4a762bceb3dbee6db3be227aa8a504f'
          file 'images/Dyl_Ulenspiegel.jpg'
      - name: Publicar imagen y retirar importador
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'images/Dyl_Ulenspiegel.jpg'
          git rm '.github/workflows/import-fli-image.yml'
          git commit -m 'Incorpora imagen histórica al memorial de Fli'
          git push
