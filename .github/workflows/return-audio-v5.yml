name: Retorno sonoro explícito v5

on:
  push:
    paths:
      - '.github/workflows/return-audio-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar versiones y bootstrap de retorno
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              s=p.read_text()
              if 'audio-preference.js?v=20260916-media1' in s:
                  s=s.replace('audio-preference.js?v=20260916-media1','audio-preference.js?v=20260916-return5')
              if p.name=='index.html':
                  s=s.replace('audio-gate.js?v=20260916-return4','audio-gate.js?v=20260916-return5')
                  marker='<script src="media-duck.js?v=20260916-media1"></script>'
                  boot='<script src="return-bootstrap.js?v=20260916-return5"></script>'
                  if boot not in s:
                      s=s.replace(marker,marker+boot)
              p.write_text(s)
          PY
      - name: Verificar
        run: |
          set -euo pipefail
          grep -q 'return-bootstrap.js?v=20260916-return5' index.html
          grep -q 'audio-preference.js?v=20260916-return5' index.html
          grep -q 'audio-preference.js?v=20260916-return5' granada.html
          grep -q 'audio-preference.js?v=20260916-return5' paco.html
          grep -q 'audio-preference.js?v=20260916-return5' miramar.html
          grep -q 'audio-preference.js?v=20260916-return5' ensayo.html
      - name: Publicar y retirar parche temporal
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git rm '.github/workflows/return-audio-v5.yml'
          git commit -m 'Activa el retorno aleatorio desde cualquier Inicio o Volumen total'
          git push
