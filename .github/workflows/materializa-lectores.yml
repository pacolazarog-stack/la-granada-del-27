name: Verifica lectores materializados

on:
  push:
    paths:
      - 'miramar.html'
      - 'miramar-canon17-*.js'
      - 'ensayo.html'
      - 'ensayo-01.js'
      - '.github/workflows/materializa-lectores.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar fuentes canónicas de los lectores
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');

          const miramarHtml=fs.readFileSync('miramar.html','utf8');
          for(const file of ['miramar-canon17-init.js','miramar-canon17-final.js','lector.js']){
            if(!miramarHtml.includes(file)) throw new Error(`Miramar: falta ${file} en el lector`);
            if(!fs.existsSync(file)) throw new Error(`Miramar: no existe ${file}`);
          }

          const ensayoHtml=fs.readFileSync('ensayo.html','utf8');
          if(!ensayoHtml.includes('ensayo-01.js')) throw new Error('Ensayo: ensayo.html no carga ensayo-01.js');
          if(!fs.existsSync('ensayo-01.js')) throw new Error('Ensayo: no existe ensayo-01.js');
          console.log('Miramar: canon 1.7 cargado por módulos');
          console.log('Ensayo: fuente ensayo-01.js cargada');
          console.log('LECTORES CANÓNICOS OK');
          NODE
