name: Verifica lectores materializados

on:
  push:
    paths:
      - 'paco-data.js'
      - 'miramar-data.js'
      - 'ensayo-data.js'
      - '.github/workflows/materializa-lectores.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar fuentes directas de los lectores
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');

          function readWork(file){
            const src=fs.readFileSync(file,'utf8');
            const ctx={window:{}};
            vm.createContext(ctx);
            vm.runInContext(src,ctx,{timeout:5000,filename:file});
            const data=ctx.window.WORK_DATA;
            if(!data||!Array.isArray(data.pages)||!data.pages.length){
              throw new Error(`${file}: WORK_DATA.pages inválido`);
            }
            while(data.pages.length&&!String(data.pages.at(-1)??'').trim()) data.pages.pop();
            console.log(`${file}: ${data.pages.length} páginas · ${data.title||'sin título'}`);
            return data;
          }

          const paco=readWork('paco-data.js');
          const miramar=readWork('miramar-data.js');
          const ensayo=readWork('ensayo-data.js');

          if(paco.pages.length!==210) throw new Error(`Paco: esperadas 210 páginas; hay ${paco.pages.length}`);
          if(!paco.pages.join('\n').includes('LOS NOMBRES DE PACO')) throw new Error('Paco: falta Los nombres de Paco');
          if(!/terraza del Miramar/i.test(miramar.title||'')) throw new Error('Miramar: título inesperado');
          if(!/poética del archivo/i.test(ensayo.title||'')) throw new Error('Ensayo: título inesperado');

          console.log('LECTORES MATERIALIZADOS OK');
          NODE
