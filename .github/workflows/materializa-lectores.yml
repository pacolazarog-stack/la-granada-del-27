name: Materializa lectores

on:
  push:
    paths:
      - '.github/workflows/materializa-lectores.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Convertir datos comprimidos en datos locales estables
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');

          function extractParts(files) {
            let b64 = '';
            for (const file of files) {
              const src = fs.readFileSync(file, 'utf8');
              const matches = [...src.matchAll(/\+\s*'([^']*)'/g)];
              if (!matches.length) throw new Error(`No se encontró fragmento base64 en ${file}`);
              for (const m of matches) b64 += m[1];
            }
            return b64.replace(/\s+/g, '');
          }

          function build(out, files) {
            const b64 = extractParts(files);
            const compressed = Buffer.from(b64, 'base64');
            const raw = zlib.gunzipSync(compressed).toString('utf8');
            const data = JSON.parse(raw);
            if (!Array.isArray(data.pages)) throw new Error(`${out}: no contiene pages[]`);
            while (data.pages.length && !String(data.pages[data.pages.length - 1] ?? '').trim()) data.pages.pop();
            fs.writeFileSync(out, `window.WORK_DATA=${JSON.stringify(data)};\n`, 'utf8');
            console.log(`${out}: ${data.pages.length} páginas, ${raw.length} caracteres`);
          }

          build('paco-data.js', ['paco-01.js','paco-02.js','paco-03.js','paco-04.js']);
          build('miramar-data.js', ['miramar-01.js','miramar-02.js']);
          build('ensayo-data.js', ['ensayo-01.js']);
          NODE
      - name: Publicar datos materializados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paco-data.js miramar-data.js ensayo-data.js
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Materializa datos estables para los lectores web"
            git push
          fi
