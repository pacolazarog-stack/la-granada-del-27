name: Install corrected Miramar corporal images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-correct-corporal-images.yml'
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode corrected source images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/miramar-correct
          for f in .tmp-miramar-b64/*.b64; do
            n="$(basename "$f" .b64)"
            base64 -d "$f" > "/tmp/miramar-correct/$n"
          done
      - name: Normalize all supplied scenes to canonical 1920x1080 WebP
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('/tmp/miramar-correct')
          dst=Path('assets/miramar-corporal/scenes')
          names=['scene-01.webp']+[f'scene-{i:02d}.webp' for i in range(11,31)]
          for name in names:
              p=src/name
              if not p.exists():
                  raise SystemExit(f'missing staged source: {name}')
              im=Image.open(p).convert('RGB')
              im=im.resize((1920,1080),Image.Resampling.LANCZOS)
              im.save(dst/name,'WEBP',quality=88,method=6)
          for i in range(1,31):
              p=dst/f'scene-{i:02d}.webp'
              im=Image.open(p)
              if im.size!=(1920,1080):
                  raise SystemExit(f'bad dimensions {p}: {im.size}')
          print('validated 30 scenes at 1920x1080')
          PY
      - name: Bust corporal image cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('miramar-corporal.js')
          s=p.read_text()
          import re
          s=re.sub(r"const IMAGE_BUILD='[^']+';","const IMAGE_BUILD='20260918-corporal-images-final-2';",s,count=1)
          p.write_text(s)
          PY
      - name: Commit corrected set and remove staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .tmp-miramar-b64
          git rm -f .github/workflows/export-corporal-02-10.yml
          git rm -f .github/workflows/install-correct-corporal-images.yml
          git add assets/miramar-corporal/scenes miramar-corporal.js
          test "$(find assets/miramar-corporal/scenes -maxdepth 1 -type f -name 'scene-*.webp' | wc -l)" -eq 30
          git commit -m "Install corrected 30-scene Miramar corporal image set"
          git push
