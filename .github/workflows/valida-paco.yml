name: Valida Paco web

on:
  push:
    paths:
      - 'paco-*.js'
      - 'paco.html'
      - '.github/workflows/valida-paco.yml'
  workflow_dispatch:

jobs:
  valida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probar cadena histórica íntegra
        run: |
          node <<'NODE'
          const fs=require('fs');
          const zlib=require('zlib');
          const files=['paco-01.js','paco-02.js','paco-03.js','paco-04.js','paco-05.js'];
          let b64='';
          for(const f of files){
            const s=fs.readFileSync(f,'utf8');
            const ms=[...s.matchAll(/\+'([^']*)'/g)];
            if(!ms.length) throw new Error(`Sin bloque base64 en ${f}`);
            for(const m of ms)b64+=m[1];
          }
          console.log('Base64 chars:',b64.length);
          const raw=zlib.gunzipSync(Buffer.from(b64,'base64')).toString('utf8');
          const data=JSON.parse(raw);
          if(!Array.isArray(data.pages)) throw new Error('No existe pages[]');
          while(data.pages.length && !String(data.pages[data.pages.length-1]??'').trim()) data.pages.pop();
          console.log(`Paco validado: ${data.pages.length} páginas lógicas; ${raw.length} caracteres JSON`);
          console.log('Título:',data.title);
          if(!/Paco Olmo de Males/i.test(data.title||'')) throw new Error('Título inesperado');
          console.log('VALIDACIÓN DE CADENA OK');
          NODE
