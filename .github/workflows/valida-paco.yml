name: Valida Paco web

on:
  push:
    paths:
      - 'paco-data.js'
      - 'paco.html'
      - 'lector.js'
      - 'paco-canon/**'
      - '.github/workflows/valida-paco.yml'
  workflow_dispatch:

jobs:
  valida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar obra canónica y lector
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const src=fs.readFileSync('paco-data.js','utf8');
          const context={window:{}};
          vm.createContext(context);
          vm.runInContext(src,context,{timeout:5000});
          const data=context.window.WORK_DATA;
          if(!data||!Array.isArray(data.pages)) throw new Error('No existe WORK_DATA.pages[]');
          while(data.pages.length&&!String(data.pages[data.pages.length-1]??'').trim()) data.pages.pop();
          if(data.pages.length!==210) throw new Error(`Se esperaban 210 páginas lógicas y hay ${data.pages.length}`);
          if(!/Paco Olmo de Males/i.test(data.title||'')) throw new Error('Título inesperado');
          if(!/nombres/i.test(data.subtitle||'')) throw new Error('El subtítulo no incorpora la nueva pieza');
          const all=data.pages.join('\n');
          for(const marker of ['LA LLAVE','LOS NOMBRES DE PACO','Copa apareció durante una partida de cartas.','Poco después llegó Copix','Siguió tirando de la red.','Paco, Repaco, metido en un saco','intentó archivar la mar','Que se registren solas']){
            if(!all.includes(marker)) throw new Error(`Falta marcador canónico: ${marker}`);
          }
          if(/Francisco Javier Lázaro Guil/i.test(all)) throw new Error('Nombre civil completo expuesto en la edición pública');
          const iHistoria=data.pages.findIndex(p=>String(p).includes('24 · LA HISTORIA'));
          const iNombres=data.pages.findIndex(p=>String(p).startsWith('LOS NOMBRES DE PACO'));
          const iCarnaval=data.pages.findIndex(p=>String(p).trim()==='CARNAVAL DE SUPERPACO');
          if(!(iHistoria<iNombres&&iNombres<iCarnaval)) throw new Error('Orden incorrecto: HISTORIA → NOMBRES → CARNAVAL');
          const html=fs.readFileSync('paco.html','utf8');
          if(!html.includes('paco-data.js')) throw new Error('paco.html no carga paco-data.js');
          if(!html.includes('lector.js')) throw new Error('paco.html no carga lector.js');
          console.log(`Paco validado: ${data.pages.length} páginas`);
          console.log('VALIDACIÓN FINAL OK');
          NODE
