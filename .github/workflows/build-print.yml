name: Build integral print PDF

on:
  push:
    branches: [print-editorial-patch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: python -m pip install --disable-pip-version-check reportlab pypdf svglib cairosvg

      - name: Build PDF
        run: python print/build_print.py

      - name: Restore canonical covers at 353 ppi
        run: python print/replace_covers.py dist/La_Granada_del_27_Edicion_Integral_A5_Imprenta.pdf

      - name: Remove unused standard-font resources
        run: python print/clean_standard_fonts.py dist/La_Granada_del_27_Edicion_Integral_A5_Imprenta.pdf

      - name: Inspect PDF
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pypdf import PdfReader
          p=Path('dist/La_Granada_del_27_Edicion_Integral_A5_Imprenta.pdf')
          r=PdfReader(str(p))
          assert len(r.pages)==84, len(r.pages)
          print(json.dumps(json.loads(Path('dist/preflight.json').read_text()),ensure_ascii=False,indent=2))
          PY
          pdffonts dist/La_Granada_del_27_Edicion_Integral_A5_Imprenta.pdf > dist/fonts.txt
          cat dist/fonts.txt
          awk 'NR>2 && $4=="no" {bad=1} END {exit bad}' dist/fonts.txt

      - name: Upload print artifact
        uses: actions/upload-artifact@v4
        with:
          name: la-granada-del-27-integral-a5-imprenta
          path: |
            dist/La_Granada_del_27_Edicion_Integral_A5_Imprenta.pdf
            dist/preflight.json
            dist/fonts.txt
          if-no-files-found: error
          retention-days: 30
