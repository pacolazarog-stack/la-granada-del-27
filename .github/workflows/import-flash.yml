name: Importar flash final

on:
  push:
    paths:
      - '.github/workflows/import-flash.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-flash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar MP4 original verificado
        run: |
          set -euo pipefail
          mkdir -p video
          curl -L --fail --retry 3 --retry-delay 1 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-d4f8-8246-93a3-77749e2002a0/raw?se=2026-09-15T23%3A40%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=2d1d6e34-fbc8-59bf-98d9-e388b54cce0f&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T22%3A08%3A08Z&ske=2026-09-16T22%3A08%3A08Z&sks=b&skv=2026-02-06&sig=Hqv%2By2rxF4yjV3JM31uWxOGln6avbJV7xy%2B/nLF1ADg%3D' -o 'video/04 - Firework_recortado_0.3s.mp4'
      - name: Verificar exactamente el MP4
        run: |
          set -euo pipefail
          test "$(stat -c%s 'video/04 - Firework_recortado_0.3s.mp4')" = '3990282'
          test "$(sha256sum 'video/04 - Firework_recortado_0.3s.mp4' | awk '{print $1}')" = 'a9341c5f8fdb8759ac298329af0de8551fd03897042a40e79647178e4423d621'
          file 'video/04 - Firework_recortado_0.3s.mp4'
      - name: Publicar flash y retirar importador
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'video/04 - Firework_recortado_0.3s.mp4'
          git rm '.github/workflows/import-flash.yml'
          git commit -m 'Incorpora flash final original de 9,70 s'
          git push
