name: Importar flash final
on:
  push:
    paths:
      - '.github/workflows/import-flash.yml'
permissions:
  contents: write
jobs:
  import-flash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar MP4 original verificado
        run: |
          set -euo pipefail
          mkdir -p video
          curl -L --fail --retry 3 --retry-delay 1 \
            'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-d4f8-8246-93a3-77749e2002a0/raw?se=2026-09-15T23%3A40%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=2d1d6e34-fbc8-59bf-98d9-e388b54cce0f&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T22%3A08%3A08Z&ske=2026-09-16T22%3A08%3A08Z&sks=b&skv=2026-02-06&sig=Hqv%2By2rxF4yjV3JM31uWxOGln6avbJV7xy%2B/nLF1ADg%3D' \
            -o 'video/04 - Firework_recortado_0.3s.mp4'
      - name: Verificar exactamente el MP4
        run: |
          set -euo pipefail
          test "$(stat -c%s 'video/04 - Firework_recortado_0.3s.mp4')" = '3990282'
          test "$(sha256sum 'video/04 - Firework_recortado_0.3s.mp4' | awk '{print $1}')" = 'a9341c5f8fdb8759ac298329af0de8551fd03897042a40e79647178e4423d621'
          file 'video/04 - Firework_recortado_0.3s.mp4'
      - name: Excluir el cierre final del retorno aleatorio
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('audio-gate.js')
          s=p.read_text()
          old="""  let readyOrigin='';
  try{readyOrigin=sessionStorage.getItem('volumeReturnReady')||'';}catch(_){}
  const directReturnOrigin=referrerOrigin();
  const backReturnOrigin=navigationType()==='back_forward'?getAwayOrigin():'';
"""
          new="""  let skipFlashExit=false;
  try{
    skipFlashExit=sessionStorage.getItem('volumeFlashExitOnce')==='1';
    if(skipFlashExit)sessionStorage.removeItem('volumeFlashExitOnce');
  }catch(_){}
  if(skipFlashExit){
    localStorage.removeItem('volumeReturnPending');
    localStorage.removeItem('volumeReturnOrigin');
    localStorage.removeItem('volumeResumeBook');
    try{sessionStorage.removeItem('volumeReturnReady');}catch(_){}
    clearAwayOrigin();
  }

  let readyOrigin='';
  try{readyOrigin=skipFlashExit?'':(sessionStorage.getItem('volumeReturnReady')||'');}catch(_){}
  const directReturnOrigin=skipFlashExit?'':referrerOrigin();
  const backReturnOrigin=skipFlashExit?'':(navigationType()==='back_forward'?getAwayOrigin():'');
"""
          if old in s:
              p.write_text(s.replace(old,new,1))
          elif 'volumeFlashExitOnce' not in s:
              raise SystemExit('No se encontró el bloque esperado en audio-gate.js')
          PY
      - name: Guardar flash y retirar importadores temporales
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'video/04 - Firework_recortado_0.3s.mp4' audio-gate.js
          git rm '.github/workflows/import-flash.yml'
          if [ -f '.github/workflows/patch-flash-exit.yml' ]; then git rm '.github/workflows/patch-flash-exit.yml'; fi
          git commit -m 'Cierra el volumen mediante el flash original de 9,70 s'
          git push
