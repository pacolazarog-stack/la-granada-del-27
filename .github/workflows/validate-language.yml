name: Validate languages

on:
  push:
    paths:
      - 'language-granada-1927-a.js'
      - 'language-granada-1927-b.js'
      - 'language-granada-1927-c.js'
      - 'texto-canonico/01_LIBRO_I_1927.md'
      - 'language-packs.js'
      - 'language-system.js'
      - 'audio-gate.js'
      - 'voice-reader.js'
      - 'index.html'
      - 'granada.html'
      - 'atlas.html'
      - 'paco.html'
      - 'miramar.html'
      - 'ensayo.html'
      - 'final.html'
      - 'autor.html'
      - 'fli.html'
      - 'validate-language.mjs'
      - '.github/workflows/validate-language.yml'
  pull_request:
    paths:
      - 'language-granada-1927-a.js'
      - 'language-granada-1927-b.js'
      - 'language-granada-1927-c.js'
      - 'texto-canonico/01_LIBRO_I_1927.md'
      - 'language-packs.js'
      - 'language-system.js'
      - 'audio-gate.js'
      - 'voice-reader.js'
      - 'index.html'
      - 'granada.html'
      - 'atlas.html'
      - 'paco.html'
      - 'miramar.html'
      - 'ensayo.html'
      - 'final.html'
      - 'autor.html'
      - 'fli.html'
      - 'validate-language.mjs'
      - '.github/workflows/validate-language.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node validate-language.mjs
