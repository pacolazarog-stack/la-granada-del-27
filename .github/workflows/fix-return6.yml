name: Refuerzo retorno aleatorio

on:
  push:
    paths:
      - '.github/workflows/fix-return6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar retorno explícito y nuevas versiones
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('section-audio.js')
          s=p.read_text()
          old="  function markReturn(){\n    if(!bookId||!soundEnabled())return;\n    saveBookMusic();\n    localStorage.setItem('volumeReturnOrigin',bookId);\n    localStorage.setItem('volumeReturnPending','1');\n    try{sessionStorage.removeItem('volumeReturnReady');}catch(_){}\n  }\n"
          new="  function markReturn(){\n    if(!bookId||!soundEnabled())return;\n    saveBookMusic();\n    localStorage.setItem('volumeReturnOrigin',bookId);\n    localStorage.setItem('volumeReturnPending','1');\n    try{sessionStorage.setItem('volumeReturnReady',bookId);}catch(_){}\n  }\n  function returnUrl(){\n    const u=new URL('index.html',location.href);\n    if(bookId&&soundEnabled()){u.searchParams.set('return',bookId);u.searchParams.set('rt',String(Date.now()));}\n    return u.href;\n  }\n  function prepareReturnLink(a){\n    if(!a||!bookId||!soundEnabled())return;\n    try{const u=new URL(a.href,location.href);u.searchParams.set('return',bookId);u.searchParams.set('rt',String(Date.now()));a.href=u.href;}catch(_){}\n  }\n"
          if old not in s: raise SystemExit('markReturn block not found')
          s=s.replace(old,new,1)
          old2="    markReturn();\n  },true);\n\n  window.BOOK_AUDIO_GATE={\n"
          new2="    markReturn();\n    prepareReturnLink(a);\n  },true);\n\n  window.BOOK_AUDIO_GATE={\n"
          if old2 not in s: raise SystemExit('click block not found')
          s=s.replace(old2,new2,1)
          old3="      if(!hasCoda||exitUnlocked){markReturn();location.href='index.html';return true;}\n"
          new3="      if(!hasCoda||exitUnlocked){markReturn();location.href=returnUrl();return true;}\n"
          if old3 not in s: raise SystemExit('requestExit branch not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          for h in Path('.').glob('*.html'):
              t=h.read_text()
              for a,b in [
                  ('voice-reader.js?v=20260916-voice2','voice-reader.js?v=20260916-voice3'),
                  ('voice-reader.js?v=20260916-voice1','voice-reader.js?v=20260916-voice3'),
                  ('section-audio.js?v=20260916-localcoda1','section-audio.js?v=20260916-return6'),
                  ('section-audio.js?v=20260916-flash1','section-audio.js?v=20260916-return6'),
                  ('section-audio.js?v=20260915-return3','section-audio.js?v=20260916-return6'),
                  ('audio-gate.js?v=20260916-return5','audio-gate.js?v=20260916-return6'),
                  ('return-bootstrap.js?v=20260916-return5','return-bootstrap.js?v=20260916-return6')]:
                  t=t.replace(a,b)
              h.write_text(t)
          PY
      - name: Guardar y retirar parche temporal
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add section-audio.js *.html
          git rm '.github/workflows/fix-return6.yml'
          git commit -m "Lee solo el verso en AZAR y refuerza el retorno aleatorio"
          git push
