name: Importa retornos temporales

on:
  push:
    paths:
      - '.github/workflows/import-retornos-temporal.yml'

permissions:
  contents: write

jobs:
  import-retornos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descarga binarios verificados
        run: |
          curl -L --fail 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-0684-8210-94e0-a4ba4506ce0f/raw?se=2026-09-15T21%3A50%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=1e1e48f7-48ff-5cca-8050-e2174ff51cbf&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T06%3A38%3A28Z&ske=2026-09-16T06%3A38%3A28Z&sks=b&skv=2026-02-06&sig=LLA8XiepJZDXJMx%2B1Il0l9Aux04d0xagYlWE1rK9J2A%3D' -o 'audio/RETORNO_1.mp3'
          curl -L --fail 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-f34c-8210-b38c-0a1545ebbb57/raw?se=2026-09-15T21%3A50%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=db5d734a-a7b9-5c4f-8f3c-404b8489387c&skoid=5c9dda00-298b-4376-81e9-b4568c8a3c0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T07%3A01%3A42Z&ske=2026-09-16T07%3A01%3A42Z&sks=b&skv=2026-02-06&sig=H1LCN9/Z49DCEzTA62YR/TtnVrxBN2cJbwFJIP78q4Y%3D' -o 'audio/RETORNO_2.mp3'
          test "$(stat -c%s 'audio/RETORNO_1.mp3')" -eq 334460
          test "$(stat -c%s 'audio/RETORNO_2.mp3')" -eq 306812
          file 'audio/RETORNO_1.mp3' | grep -qi 'audio\|mpeg\|ID3'
          file 'audio/RETORNO_2.mp3' | grep -qi 'audio\|mpeg\|ID3'
      - name: Publica retornos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'audio/RETORNO_1.mp3' 'audio/RETORNO_2.mp3'
          git commit -m 'Aloja los contrapuntos de retorno en el sitio'
          git push
