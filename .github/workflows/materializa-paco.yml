name: Verifica Paco canónico

on:
  push:
    paths:
      - 'paco-data.js'
      - 'paco.html'
      - 'paco-canon/**'
      - '.github/workflows/materializa-paco.yml'
  workflow_dispatch:

jobs:
  verifica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar fuente canónica directa
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const src=fs.readFileSync('paco-data.js','utf8');
          const context={window:{}};
          vm.createContext(context);
          vm.runInContext(src,context,{timeout:5000});
          const data=context.window.WORK_DATA;
          if(!data||!Array.isArray(data.pages)) throw new Error('WORK_DATA inválido');
          while(data.pages.length&&!String(data.pages[data.pages.length-1]||'').trim()) data.pages.pop();
          if(data.pages.length!==210) throw new Error(`Se esperaban 210 páginas canónicas y hay ${data.pages.length}`);
          const all=data.pages.join('\n');
          for(const marker of ['LOS NOMBRES DE PACO','Copa apareció durante una partida de cartas.','Poco después llegó Copix','Siguió tirando de la red.','CARNAVAL DE SUPERPACO','intentó archivar la mar','Que se registren solas']){
            if(!all.includes(marker)) throw new Error(`Falta marcador canónico: ${marker}`);
          }
          if(/Francisco Javier Lázaro Guil/i.test(all)) throw new Error('La edición web pública contiene el nombre civil completo');
          console.log(`Paco canónico OK: ${data.pages.length} páginas`);
          NODE
