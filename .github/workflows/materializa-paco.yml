name: Materializa Paco web

on:
  push:
    paths:
      - 'paco-b64-*.txt'
      - '.github/workflows/materializa-paco.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materializa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir paco-data.js
        run: |
          wc -c paco-b64-01.txt paco-b64-02.txt paco-b64-03.txt paco-b64-04.txt paco-b64-05.txt paco-b64-06.txt
          sha256sum paco-b64-01.txt paco-b64-02.txt paco-b64-03.txt paco-b64-04.txt paco-b64-05.txt paco-b64-06.txt
          cat paco-b64-01.txt paco-b64-02.txt paco-b64-03.txt paco-b64-04.txt paco-b64-05.txt paco-b64-06.txt > paco-data.js.gz.b64
          base64 -d paco-data.js.gz.b64 | gunzip > paco-data.js
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const src=fs.readFileSync('paco-data.js','utf8');
          const context={window:{}};
          vm.createContext(context);
          vm.runInContext(src,context,{timeout:5000});
          const data=context.window.WORK_DATA;
          if(!data || !Array.isArray(data.pages)) throw new Error('WORK_DATA inválido');
          while(data.pages.length && !String(data.pages[data.pages.length-1]||'').trim()) data.pages.pop();
          if(data.pages.length!==198) throw new Error(`Se esperaban 198 páginas y hay ${data.pages.length}`);
          const all=data.pages.join('\n');
          for(const marker of ['LA LLAVE','Paco, Repaco, metido en un saco','intentó archivar la mar','Que se registren solas']){
            if(!all.includes(marker)) throw new Error(`Falta marcador canónico: ${marker}`);
          }
          console.log(`Paco OK: ${data.pages.length} páginas; ${src.length} caracteres JS`);
          NODE
      - name: Publicar dato estable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paco-data.js
          git commit -m "Materializa Paco canónico para el lector web" || exit 0
          git push
