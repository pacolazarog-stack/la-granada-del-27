name: Importar codas originales

on:
  push:
    paths:
      - '.github/workflows/import-codas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-codas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar codas originales
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audio
          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-00e0-81f4-9ff8-b22dd149257e/raw?se=2026-09-15T23%3A03%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=6abf643d-b51d-55f5-8aee-44797b5ecf2d&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A09%3A12Z&ske=2026-09-16T19%3A09%3A12Z&sks=b&skv=2026-02-06&sig=sC%2F0FyiH8npn3brCAaDPG6FR%2FkX6wH4xruyRoYuGF2w%3D' -o 'audio/LA GRANADA DEL 27(2).mp3'
          curl -fL --retry 3 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-fa5c-81f4-a7a3-83351a9d3c43/raw?se=2026-09-15T23%3A03%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=855650aa-9e96-5858-9459-0a3b6ba81b9f&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T09%3A47%3A37Z&ske=2026-09-16T09%3A47%3A37Z&sks=b&skv=2026-02-06&sig=NK30uZrt%2F7qjJdRI4kePTbPt%2FjzDZlIjMT%2Bh2DiLVkM%3D' -o 'audio/PACO OLMO DE MALES(2).mp3'
          curl -fL --retry 3 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-b03c-820a-bb01-12d80082536e/raw?se=2026-09-15T23%3A04%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=35edc2f8-1ac4-5450-b364-e3ca0a18bae7&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T09%3A01%3A44Z&ske=2026-09-16T09%3A01%3A44Z&sks=b&skv=2026-02-06&sig=Vity5O9dBNzysAHPBEq0WvBE6mC67vdX83%2FS%2Fy7btz8%3D' -o 'audio/LA TERRAZA DEL MIRAMAR(2).mp3'
          curl -fL --retry 3 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-c034-8210-8874-dd8fdaff03a8/raw?se=2026-09-15T23%3A04%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=ca9b2ab4-a578-57c4-abe1-735a03ffbfe2&skoid=8981e47a-681f-4a6a-b86c-73d6347614b7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T22%3A17%3A55Z&ske=2026-09-16T22%3A17%3A55Z&sks=b&skv=2026-02-06&sig=b6UEXS2dnmI%2FrYsNqbTCESuKaouiLhVL3cPOS2W4nNE%3D' -o 'audio/LA POÉTICA DEL ARCHIVO(1).mp3'

      - name: Verificar MP3
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            'audio/LA GRANADA DEL 27(2).mp3' \
            'audio/PACO OLMO DE MALES(2).mp3' \
            'audio/LA TERRAZA DEL MIRAMAR(2).mp3' \
            'audio/LA POÉTICA DEL ARCHIVO(1).mp3'; do
            test -s "$f"
            echo "$(wc -c < "$f") bytes · $f"
            file "$f" | grep -Eqi 'audio|MPEG|ID3'
          done

      - name: Guardar codas en main y retirar importador
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audio/*.mp3
          git rm -f .github/workflows/import-codas.yml
          git commit -m 'Aloja las codas originales en el sitio'
          git push origin HEAD:main
