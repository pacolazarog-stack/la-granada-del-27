name: Fuerza retorno sonoro v7

on:
  push:
    paths:
      - '.github/workflows/cache-return7.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar versiones de caché
        run: |
          set -euo pipefail
          for f in *.html; do
            sed -i 's/audio-preference.js?v=20260916-return5/audio-preference.js?v=20260916-return7/g' "$f"
            sed -i 's/return-bootstrap.js?v=20260916-return6/return-bootstrap.js?v=20260916-return7/g' "$f"
          done
      - name: Guardar y retirar parche temporal
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git rm '.github/workflows/cache-return7.yml'
          git commit -m 'Activa retorno aleatorio en el clic de salida'
          git push
